<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<title>:\ARCHITECT\ Podium</title>
<style>
  :root {
  --brand-accent: #2454dd; /* //RULES// interactive blue */ --bg: #ffffff; --panel: #ffffff; --line: #d6dce1; --text: #111820; --dim: #52606b; --accent: #111820; --ok: #1a7f37; --bad: #c62828; --warn: #9a6700; --soft: rgba(17, 24, 32, .04); }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font: 14px/1.5 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-weight:400; font-size:18px; margin:0; letter-spacing:-.03em; }
  sup.tm { font-size:.38em; vertical-align:super; line-height:0; margin-left:.08em; }
  header .tag { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); min-height:calc(100vh - 53px); }
  aside { border-right:1px solid var(--line); padding:16px; overflow:auto; min-width:0; }
  form > * { width:100%; }
  section { padding:20px; overflow:auto; }
  form { display:grid; gap:8px; margin-bottom:18px; }
  textarea,input,select,button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius: 0; padding:8px 10px; }
  textarea { min-height:80px; resize:vertical; }
  button { cursor:pointer; }
  button.primary { background:var(--text); color:#fff; border-color:var(--text); font-weight:400; }
  button.primary:hover:not(:disabled) { background:var(--brand-accent); border-color:var(--brand-accent); }
  button:disabled { opacity:.5; }
  textarea:focus,input:focus,select:focus { outline:2px solid var(--text); outline-offset:-1px; }
  .run { padding:8px 10px; border:1px solid var(--line); border-radius: 0; margin-bottom:6px; cursor:pointer; }
  .run:hover,.run.active { border-color:var(--accent); }
  .run .goal { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status { font:11px ui-monospace,monospace; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .status.succeeded { color:var(--ok); } .status.failed { color:var(--bad); } .status.awaiting_approval,.status.handed_off { color:var(--warn); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius: 0; padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 10px; }
  .steps li { margin:4px 0; } .steps .done { color:var(--ok); } .steps .failed { color:var(--bad); } .steps .running { color:var(--accent); }
  .approval { border:2px solid var(--text); }
  .approval pre { white-space:pre-wrap; word-break:break-word; background:var(--soft); padding:8px; border-radius: 0; }
  .log { font:12px/1.6 ui-monospace,monospace; max-height:420px; overflow:auto; }
  .log div { border-bottom:1px solid rgba(17,24,32,.06); padding:2px 0; }
  .log .t { color:var(--dim); margin-right:8px; }
  .shots { display:flex; gap:8px; flex-wrap:wrap; } .shots img { width:220px; border:1px solid var(--line); border-radius: 0; }
  .crit.met::before { content:"✓ "; color:var(--ok); } .crit.unmet::before { content:"✗ "; color:var(--bad); }
  .row { display:flex; gap:8px; }
  .empty { color:var(--dim); }
  .error { margin:0; padding:10px 12px; border:1px solid var(--bad); border-radius: 0; color:var(--bad); background:transparent; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } }
  @media (max-width: 520px) {
    body { font-size:15px; }
    header { padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top)); flex-wrap:wrap; gap:4px 12px; }
    header .tag { font-size:11px; }
    aside, section { padding:14px 16px; }
    textarea,input,select,button { padding:12px; font-size:16px; } /* 16px stops mobile zoom on focus */
    .run { padding:12px; }
    .shots img { width:100%; }
    .log { max-height:300px; }
    .row { flex-wrap:wrap; } .row > button { flex:1 1 auto; min-height:44px; }
  }
</style>
</head>
<body>
<header>
  <h1>:\ARCHITECT\<sup class="tm">™</sup></h1><span class="tag">Podium — you set the direction, Architect carries it through</span>
</header>
<main>
  <aside>
    <form id="new">
      <textarea name="goal" placeholder="Describe the outcome you want…" required></textarea>
      <input name="startUrl" placeholder="Start URL (optional)" />
      <select name="autonomy">
        <option value="rehearsal">Rehearsal — plan and draft only</option>
        <option value="accompaniment" selected>Accompaniment — pause at decisions</option>
        <option value="autopilot">Autopilot — run within standing permissions</option>
      </select>
      <button class="primary">Build</button>
      <p id="form-error" class="error" role="alert" hidden></p>
    </form>
    <form id="token-form" hidden>
      <label for="token-input">This server needs its API token (ARCHITECT_API_TOKEN). It stays in this browser.</label>
      <input id="token-input" name="token" type="password" autocomplete="off" placeholder="API token" required />
      <button class="primary">Save token</button>
    </form>
    <div id="runs"></div>
  </aside>
  <section id="detail"><p class="empty">Choose a run, or describe an outcome to start one.</p></section>
</main>
<script>
  let token = "";
  try { token = new URLSearchParams(location.search).get("token") || localStorage.getItem("architect.token") || ""; } catch {}
  if (token) try { localStorage.setItem("architect.token", token); } catch {}
  // Keep the token out of the address bar and browser history once it is stored.
  if (new URLSearchParams(location.search).has("token")) history.replaceState(null, "", location.pathname);
  const api = (p, opts = {}) => fetch(p, { ...opts, headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) } })
    .then(async (r) => {
      const d = await r.json();
      if (r.status === 401) document.getElementById("token-form").hidden = false;
      if (!r.ok) throw new Error(d.error || r.statusText);
      return d;
    });
  document.getElementById("token-form").onsubmit = (e) => {
    e.preventDefault();
    token = document.getElementById("token-input").value.trim();
    try { localStorage.setItem("architect.token", token); } catch {}
    e.target.hidden = true;
    e.target.reset();
    loadRuns().catch((err) => document.getElementById("runs").innerHTML = `<p class="empty">${esc(err.message)}</p>`);
  };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  let current = null, source = null, events = [];

  async function loadRuns() {
    const runs = await api("/v1/runs");
    document.getElementById("runs").innerHTML = runs.map((r) =>
      `<div class="run ${r.id === current ? "active" : ""}" data-id="${r.id}"><div class="status ${r.status}">${esc(r.status)} · ${esc(r.autonomy)}</div><div class="goal">${esc(r.score.goal)}</div></div>`).join("") || '<p class="empty">No runs yet.</p>';
    document.querySelectorAll(".run").forEach((el) => el.onclick = () => open(el.dataset.id));
  }

  async function open(id) {
    current = id; events = [];
    source?.close();
    source = new EventSource(`/v1/runs/${id}/events${token ? "?token=" + encodeURIComponent(token) : ""}`);
    source.onmessage = () => {};
    const types = ["run.composed","run.status","step.started","step.completed","step.failed","action","evidence","architect.note","approval.requested","approval.decided","run.verified","run.handed_off","run.attested","run.encore","run.recovering"];
    types.forEach((t) => source.addEventListener(t, (e) => { events.push(JSON.parse(e.data)); render(); }));
    await render(); loadRuns();
  }

  let renderTimer = null;
  function render() { clearTimeout(renderTimer); renderTimer = setTimeout(draw, 120); }

  async function draw() {
    if (!current) return;
    const [run, approvals] = await Promise.all([api(`/v1/runs/${current}`), api("/v1/approvals")]);
    const mine = approvals.filter((a) => a.runId === current);
    const shots = run.evidence.filter((e) => e.kind === "screenshot" && e.path);
    const stateOf = (id) => run.steps.find((s) => s.id === id) || {};
    document.getElementById("detail").innerHTML = `
      <div class="card"><h2>Goal</h2><div>${esc(run.score.goal)}</div>
        <div class="status ${run.status}" style="margin-top:8px">${esc(run.status)} · ${esc(run.autonomy)}${run.error ? " · " + esc(run.error) : ""}</div>
        ${run.usage ? `<div style="color:var(--dim);font-size:12px;margin-top:4px">spent $${run.usage.costUsd.toFixed(2)}${run.budgetUsd ? ` of $${run.budgetUsd.toFixed(2)} limit` : ""} · ${run.usage.calls} model calls${run.source ? " · " + esc(run.source) : ""}</div>` : ""}
        <div class="row" style="margin-top:10px">
          ${["failed","handed_off"].includes(run.status) ? '<button data-act="recover">Recover</button>' : ""}
          ${["succeeded","failed","rehearsed"].includes(run.status) ? '<button data-act="encore">Encore</button>' : ""}
          ${["performing","awaiting_approval","verifying"].includes(run.status) ? '<button data-act="cancel">Cancel</button>' : ""}
        </div></div>
      ${mine.map((a) => `<div class="card approval"><h2>Decision waiting for you</h2>
        <div>${esc(a.reason)}</div>${a.tool ? `<pre>${esc(a.tool)} ${esc(JSON.stringify(a.input, null, 2))}</pre>` : ""}
        <div class="row"><button class="primary" data-approve="${a.id}">Approve</button><button data-decline="${a.id}">Decline</button></div></div>`).join("")}
      <div class="card"><h2>Score</h2><div style="color:var(--dim);margin-bottom:8px">${esc(run.score.summary)}</div>
        <ol class="steps">${run.score.steps.map((s) => `<li class="${stateOf(s.id).status}"><b>${esc(s.title)}</b>${s.checkpoint ? " ⏸" : ""}<br><span style="color:var(--dim)">${esc(stateOf(s.id).summary || s.instruction)}</span></li>`).join("")}</ol>
        <div style="color:var(--dim);font-size:12px">permissions: ${esc(run.score.permissions.join(", "))}</div></div>
      ${run.verdict ? `<div class="card"><h2>Verification — ${run.verdict.passed ? "passed" : "not passed"}</h2><div>${esc(run.verdict.summary)}</div>
        <ul>${run.verdict.criteria.map((c) => `<li class="crit ${c.met ? "met" : "unmet"}">${esc(c.criterion)} <span style="color:var(--dim)">— ${esc(c.evidence)}</span></li>`).join("")}</ul></div>` : ""}
      ${shots.length ? `<div class="card"><h2>Evidence</h2><div class="shots">${shots.slice(-8).map((e) => `<a href="/v1/runs/${run.id}/evidence/${e.path.split(/[\\/]/).pop()}${token ? "?token=" + encodeURIComponent(token) : ""}" target="_blank"><img src="/v1/runs/${run.id}/evidence/${e.path.split(/[\\/]/).pop()}${token ? "?token=" + encodeURIComponent(token) : ""}" alt="${esc(e.label)}" title="${esc(e.label)}"></a>`).join("")}</div></div>` : ""}
      <div class="card"><h2>Performance</h2><div class="log">${events.slice(-300).map(line).join("")}</div></div>`;
    document.querySelectorAll("[data-approve]").forEach((b) => b.onclick = () => decide(b.dataset.approve, true));
    document.querySelectorAll("[data-decline]").forEach((b) => b.onclick = () => decide(b.dataset.decline, false));
    document.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => act(b.dataset.act));
    const log = document.querySelector(".log"); if (log) log.scrollTop = log.scrollHeight;
  }

  function line(ev) {
    const t = ev.at.slice(11, 19), d = ev.data;
    const text = {
      "action": () => `${d.outcome} · ${d.tool} ${JSON.stringify(d.input).slice(0, 120)}`,
      "architect.note": () => d.text.slice(0, 200),
      "step.started": () => `▶ ${d.title}`, "step.completed": () => `✓ ${d.summary}`, "step.failed": () => `✗ ${d.reason}`,
      "run.status": () => `status → ${d.status}`, "approval.requested": () => `⏸ ${d.reason}`,
      "approval.decided": () => d.approved ? "approved" : `declined ${d.note || ""}`,
      "evidence": () => `evidence · ${d.kind} · ${d.label}`, "run.verified": () => d.passed ? "verified ✓" : "not verified ✗",
    }[ev.type];
    return text ? `<div><span class="t">${t}</span>${esc(text())}</div>` : "";
  }

  async function decide(id, approved) {
    const note = approved ? undefined : prompt("Why? (optional)") || undefined;
    await api(`/v1/approvals/${id}`, { method: "POST", body: JSON.stringify({ approved, note, by: "podium" }) });
    render();
  }

  async function act(kind) {
    let body = {};
    if (kind === "encore") {
      const raw = prompt("New inputs as JSON, e.g. {\"supplier\":\"Acme\"}", "{}");
      if (raw === null) return;
      body = { inputs: JSON.parse(raw || "{}") };
    }
    await api(`/v1/runs/${current}/${kind}`, { method: "POST", body: JSON.stringify(body) });
    setTimeout(() => { loadRuns(); render(); }, 800);
  }

  document.getElementById("new").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    document.getElementById("form-error").hidden = true;
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Composing…";
    try {
      const run = await api("/v1/runs", { method: "POST", body: JSON.stringify({ goal: f.get("goal"), autonomy: f.get("autonomy"), startUrl: f.get("startUrl") || undefined }) });
      e.target.reset(); await open(run.id);
    } catch (err) { const el = document.getElementById("form-error"); el.textContent = err.message; el.hidden = false; }
    finally { btn.disabled = false; btn.textContent = "Build"; }
  };

  loadRuns().catch((e) => document.getElementById("runs").innerHTML = `<p class="empty">${esc(e.message)}</p>`);
  setInterval(() => { loadRuns().catch(() => {}); if (current) render(); }, 5000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
